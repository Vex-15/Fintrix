services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fintrix
      POSTGRES_PASSWORD: fintrix
      POSTGRES_DB: fintrix
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintrix"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://fintrix:fintrix@db:5432/fintrix
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app  # hot reload in dev

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src  # hot reload in dev

volumes:
  pgdata:
